
name: Node.js deployment

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout    
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26.13.0 
        cache: 'npm'

    - run: npm ci
    - run: npm run build --if-present
    - run: npm run test
